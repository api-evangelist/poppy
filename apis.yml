aid: poppy
name: Poppy
description: >-
  Poppy (poppyflowers.com) is an online, full-service wedding florist that
  designs, delivers, and sets up personalized floral arrangements for weddings
  across multiple US locations. Couples receive a custom floral proposal based
  on their style preferences, with bridal and bridesmaid bouquets, boutonnieres,
  ceremony installations, arches, reception centerpieces, and table
  arrangements, all delivered and installed on-site by Poppy's team. The company
  publishes pricing guidance (a $1,750 order minimum, ~$3,400 average spend, a
  $249 deposit to secure dates) and offers interest-free monthly payment plans
  and flexible modifications up to 60 days before the event. Poppy was surfaced
  as a portfolio company of Anthemis and Techstars and added to the API
  Evangelist network. As of this enrichment pass Poppy operates a
  consumer-facing website only and publishes no public API, developer portal, or
  technical documentation.
